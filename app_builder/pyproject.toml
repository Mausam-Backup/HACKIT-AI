[project]
name = "hackathon-project-coach"
version = "0.2.0"
description = "Hackathon Project Coach — Idea to Demo in minutes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "playwright>=1.40",
    "psutil>=5.9",
    "Pillow>=10.0",
    "jinja2>=3.1",
    "tiktoken>=0.5",
    "numpy>=1.24",
    "rich>=13.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
