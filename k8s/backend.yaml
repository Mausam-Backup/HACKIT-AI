apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: hackit
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackit
      component: backend
  template:
    metadata:
      labels:
        app: hackit
        component: backend
    spec:
      containers:
      - name: backend
        image: hackit-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: hackit
    component: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
