apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hackit
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackit
      component: frontend
  template:
    metadata:
      labels:
        app: hackit
        component: frontend
    spec:
      containers:
      - name: frontend
        image: hackit-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: hackit
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
